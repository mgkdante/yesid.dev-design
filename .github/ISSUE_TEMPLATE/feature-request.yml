name: Feature request
description: Propose a shared contract that real consumers need
title: "[request] "
labels: []
assignees: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't the packages do today?
    validations:
      required: true
  - type: textarea
    id: consumers
    attributes:
      label: Consumers
      description: Which products need this, and what do they do today?
      placeholder: Links or exact commits.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behavior you want, and how existing consumers keep working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
