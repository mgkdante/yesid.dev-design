name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated v* tag whose first publication failed
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'mgkdante/yesid.design'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check the tag
        run: |
          set -euo pipefail
          git rev-parse --verify "refs/tags/${TAG}^{tag}" >/dev/null
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "refs/tags/${TAG}^{commit}" refs/remotes/origin/main
          bun run release:check -- --version "${TAG#v}" --tag "$TAG"
      - run: bun run check
      - run: bun run test
      # Dispatch can target a tag whose CLI predates the packing command.
      - name: Check out packing runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-runner
          sparse-checkout: tools
          persist-credentials: false
      - name: Pack
        run: bun .release-runner/tools/release.ts pack --checkout "$GITHUB_WORKSPACE" --tag "$TAG" --repository "$GITHUB_REPOSITORY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tgz
      - name: Publish
        # gh uploads every asset to a draft and publishes last, so the immutable release is complete.
        run: |
          set -euo pipefail
          prerelease=false
          if [[ "${TAG%%+*}" == *-* ]]; then prerelease=true; fi
          gh release create "$TAG" dist/*.tgz \
            --verify-tag \
            --title "$TAG" \
            --notes "Changes: https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md" \
            --prerelease="$prerelease"
