name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated v* tag whose first publication failed
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'mgkdante/yesid.dev-design'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check the tag
        run: |
          set -euo pipefail
          git rev-parse --verify "refs/tags/${TAG}^{tag}" >/dev/null
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "refs/tags/${TAG}^{commit}" refs/remotes/origin/main
          bun run release:check -- --version "${TAG#v}" --tag "$TAG"
      - run: bun run check
      - run: bun run test
      - name: Pack
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mkdir dist
          for dir in packages/*/; do
            # Sibling peers resolve to this release's assets, never to the npm registry.
            sed -i -E "s#\"@yesid/([a-z0-9-]+)\": \"workspace:[^\"]*\"#\"@yesid/\1\": \"${base}/yesid-\1-${version}.tgz\"#" "${dir}package.json"
            cp LICENSE NOTICE "$dir"
            (cd "$dir" && bun pm pack --destination ../../dist)
          done
          test "$(find dist -name '*.tgz' | wc -l)" -eq 8
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tgz
      - name: Publish
        # gh uploads every asset to a draft and publishes last, so the immutable release is complete.
        run: |
          set -euo pipefail
          prerelease=false
          if [[ "${TAG%%+*}" == *-* ]]; then prerelease=true; fi
          gh release create "$TAG" dist/*.tgz \
            --verify-tag \
            --title "$TAG" \
            --notes "Changes: https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md" \
            --prerelease="$prerelease"
