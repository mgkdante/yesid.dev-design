# Public-repository CI. Every pull request runs every job; the final `ci` job is the required check.
name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-turbo: 'true'
          cache-vitest: 'true'
      - name: API report approval
        env:
          API_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$API_BASE_SHA"
          bun run api:approve -- --base "$API_BASE_SHA"
      - name: typecheck
        run: bun run check
      - name: tests
        run: bun run test
      - name: token drift gate
        run: bun run ci:tokens
      - name: Upload Ubuntu token outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: token-outputs-ubuntu
          if-no-files-found: error
          retention-days: 3
          path: |
            DESIGN.md
            packages/tokens/theme.css
            packages/motion/src/tokens.ts
            packages/tokens/tokens.css
      - name: build
        run: bun x turbo run build

  browser-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install container setup prerequisite
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends unzip
          rm -rf /var/lib/apt/lists/*
      - uses: ./.github/actions/setup
      - name: Run browser authority
        run: bun run test:browser
      - name: Upload browser failure evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-authority-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            apps/gallery/playwright-report/
            apps/gallery/test-results/

  token-outputs-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Check API reports
        run: bun run api:check
      - name: Generate token outputs
        run: bun run tokens:build
      - name: Upload Windows token outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: token-outputs-windows
          if-no-files-found: error
          retention-days: 3
          path: |
            DESIGN.md
            packages/tokens/theme.css
            packages/motion/src/tokens.ts
            packages/tokens/tokens.css

  token-byte-parity:
    needs: [check, token-outputs-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: token-outputs-ubuntu
          path: artifacts/ubuntu
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: token-outputs-windows
          path: artifacts/windows
      - name: Compare generated bytes
        shell: bash
        run: |
          files=(
            DESIGN.md
            packages/tokens/theme.css
            packages/motion/src/tokens.ts
            packages/tokens/tokens.css
          )
          for file in "${files[@]}"; do
            if ! cmp --silent "artifacts/ubuntu/$file" "artifacts/windows/$file"; then
              echo "::error file=$file::Ubuntu and Windows generated different bytes"
              sha256sum "artifacts/ubuntu/$file" "artifacts/windows/$file"
              exit 1
            fi
          done

  ci:
    if: ${{ always() }}
    needs: [check, browser-authority, token-outputs-windows, token-byte-parity]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
